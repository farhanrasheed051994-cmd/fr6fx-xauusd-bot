name: FR6FX Daily XAUUSD Reels & Telegram Automation

on:
  push:
    branches: [ main ]
    paths:
      - 'data/mt5_data.json'
  workflow_dispatch:         # Manual Run button for testing anytime

concurrency:
  group: fr6fx-publish-pipeline
  cancel-in-progress: false  # Never kill a live upload mid-way; queue safely instead

permissions:
  contents: write

jobs:
  run-fr6fx-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout FR6FX Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Phase 1 - Run Multi-Timeframe MT5 SMC & AI Analysis
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_LINK: ${{ secrets.TELEGRAM_LINK }}
        run: python analyze_session.py

      - name: Phase 2 - Render Animated Reel & Institutional Telegram Chart
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_LINK: ${{ secrets.TELEGRAM_LINK }}
        run: python video_editor.py

      - name: Phase 3 - Publish to Telegram, YouTube Shorts, Instagram & Facebook
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python publish_all.py

      - name: Phase 4 - Commit Run State & Analytics Log
        if: always()
        run: |
          if [ -d "state" ]; then
            git config user.name "FR6FX Automation Bot"
            git config user.email "bot@fr6fx.local"
            git add state/
            if ! git diff --staged --quiet; then
              git commit -m "Update FR6FX run state & analytics log [skip ci]"
              git pull --rebase --autostash
              git push
            fi
          fi

      - name: Alert Telegram on Pipeline Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://telegram.org{TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=🚨 FR6FX GitHub Pipeline Failed! Check logs: https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
          fi
