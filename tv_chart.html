<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, .tradingview-widget-container {
      width: 100%;
      height: 100%;
      background-color: #0b0e14;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const interval = params.get("interval") || "15";

    const s = document.createElement("script");
    s.type = "text/javascript";
    s.async = true;
    s.src = "https://tradingview.com";
    s.textContent = JSON.stringify({
      "autosize": true,
      "symbol": "OANDA:XAUUSD",
      "interval": interval,
      "timezone": "Asia/Karachi",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "backgroundColor": "#0b0e14",
      "gridColor": "#151a24",
      "hide_top_toolbar": true,
      "hide_legend": false,
      "hide_side_toolbar": true,
      "allow_symbol_change": false,
      "save_image": false,
      "hide_volume": true,
      "studies": [
        "STD;EMA",
        "STD;EMA",
        "STD;RSI"
      ],
      "studies_overrides": {
        "moving average exponential.length": 20,
        "moving average exponential.plot.color": "#38bdf8",
        "moving average exponential #1.length": 50,
        "moving average exponential #1.plot.color": "#f59e0b"
      },
      "support_host": "https://tradingview.com"
    });
    document.querySelector(".tradingview-widget-container").appendChild(s);
  </script>
</body>
</html>
